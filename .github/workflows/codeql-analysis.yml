name: CodeQL
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '43 1 * * 1'
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL (swift)
    runs-on: macos-26
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine Swift scan scope
        id: scope
        env:
          STUDSYNC_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./script/swift_scan_scope.sh
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: steps.scope.outputs.scan == 'true'
        with:
          languages: swift
          build-mode: manual
          db-location: ${{ runner.temp }}/codeql_databases
      - name: Build Swift for CodeQL
        if: steps.scope.outputs.scan == 'true'
        run: swift build --verbose
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: steps.scope.outputs.scan == 'true'
      - name: Verify first-party Swift source coverage
        if: steps.scope.outputs.scan == 'true'
        env:
          STUDSYNC_CODEQL_DATABASE: ${{ runner.temp }}/codeql_databases/swift
        run: ./script/verify_codeql_sources.sh
