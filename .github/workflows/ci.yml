name: CI
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '43 1 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scan: ${{ steps.scope.outputs.scan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          STUDSYNC_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./script/swift_scan_scope.sh
  native:
    name: Native tests and app bundle
    needs: scope
    if: always() && github.event_name != 'schedule' && (needs.scope.result != 'success' || needs.scope.outputs.scan == 'true')
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Require successful change classification
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./script/test_workflow_helpers.sh
      - run: ./script/test_release_helpers.sh
      - run: swift test
      - run: ./script/test_updates.sh
      - run: ./script/package_release.sh 0.1.0 "$GITHUB_RUN_NUMBER" "$RUNNER_TEMP/release-test"
      - run: ./script/test_release_bundle.sh "$RUNNER_TEMP/release-test/StudSync-0.1.0-arm64.zip"
  analyze:
    name: CodeQL (swift)
    needs: scope
    if: always() && (needs.scope.result != 'success' || needs.scope.outputs.scan == 'true')
    runs-on: macos-15-intel
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Require successful change classification
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: swift
          build-mode: manual
          db-location: ${{ runner.temp }}/codeql_databases
      - run: swift build --arch arm64 --verbose
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      - name: Verify first-party Swift source coverage
        env:
          STUDSYNC_CODEQL_DATABASE: ${{ runner.temp }}/codeql_databases/swift
        run: ./script/verify_codeql_sources.sh
