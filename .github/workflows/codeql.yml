name: CodeQL
# Called by CI (master pushes, weekly scan) and by the release workflow before a draft is created.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL (swift)
    # CodeQL's tracer runs under Rosetta on Apple Silicon; Intel keeps the traced build native.
    runs-on: macos-15-intel
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: swift
          build-mode: manual
          db-location: ${{ runner.temp }}/codeql_databases
      # Always a clean, uncached build: restored objects would skip extraction.
      - run: swift build --arch arm64 --verbose
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      - name: Verify first-party Swift source coverage
        env:
          STUDSYNC_CODEQL_DATABASE: ${{ runner.temp }}/codeql_databases/swift
        run: ./script/verify_codeql_sources.sh
