name: Tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native tests and app bundle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./script/test_workflow_helpers.sh
      - run: swift test
      - run: ./script/package_release.sh 0.1.0 "$GITHUB_RUN_NUMBER" "$RUNNER_TEMP/release-test"
